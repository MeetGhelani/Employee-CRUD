<h2>Employee List</h2>

<p>Employee Count: {{ employees().length }}</p>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Department</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    @for (
      employee of employees();
      track employee.id
    ) {
    <tr>
      <td>{{ employee.id }}</td>
      <td>{{ employee.name }}</td>
      <td>{{ employee.email }}</td>
      <td>{{ employee.department }}</td>
      <td>
        <button
          (click)="editEmployee(employee)">
          Edit
        </button>

        <button
          (click)="deleteEmployee(employee.id)">
          Delete
        </button>
      </td>
    </tr>
}
  </tbody>
</table>
